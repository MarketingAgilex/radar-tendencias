name: Recolectar tendencias

on:
  schedule:
    - cron: "7 * * * *"     # pulso: cada hora
    - cron: "37 */6 * * *"  # sectores: cada 6 horas
    - cron: "15 10 * * *"   # diario: 5:15 a. m. hora Colombia
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué recolectar"
        required: true
        default: "pulso"
        type: choice
        options: [pulso, sectores, diario]

permissions:
  contents: write

concurrency:
  group: radar-datos
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Elegir modo
        id: modo
        run: |
          case "${{ github.event.schedule }}" in
            "37 */6 * * *") echo "modo=sectores" >> "$GITHUB_OUTPUT" ;;
            "15 10 * * *")  echo "modo=diario"   >> "$GITHUB_OUTPUT" ;;
            "7 * * * *")    echo "modo=pulso"    >> "$GITHUB_OUTPUT" ;;
            *)              echo "modo=${{ inputs.modo || 'pulso' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Recolectar
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/recolectar.py ${{ steps.modo.outputs.modo }}

      - name: Guardar datos
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "datos: ${{ steps.modo.outputs.modo }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 5
          done
